<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saga · Senior-to-junior feedback · UI prototypes (concept draft)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Raleway:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--side:#f0ede6;--card:#fff;--line:#e6e1d6;--line2:#d9d3c5;--ink:#1d1d1b;--mut:#6f6a60;--soft:#f3f0e9;--hover:#ebe7de;
--blue:#3b5bdb;--blueS:#e8edff;--green:#2f7d4f;--greenS:#e5f3ea;--red:#b4382b;--redS:#fbe9e6;--amber:#9a6a12;--amberS:#fbf1dc;--violet:#6741d9;--violetS:#efeaff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.disp{font-family:Raleway,Inter,sans-serif;font-weight:500;letter-spacing:-.01em;margin:0}
button{font:inherit;cursor:pointer}
textarea,input,select{font:inherit;color:inherit}
a{color:inherit}
.top{position:sticky;top:0;z-index:50;background:rgba(247,245,240,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topin{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 24px}
.logo{display:flex;align-items:center;gap:8px;font-family:Raleway;font-weight:600;font-size:22px;letter-spacing:-.02em}
.logo svg{width:22px;height:22px}
.draft{font-size:11px;padding:2px 8px;border:1px solid var(--line2);border-radius:20px;color:var(--mut)}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;padding:6px 12px;border-radius:8px;color:var(--mut)}
.tab:hover{background:var(--hover)}
.tab.on{background:#fff;border-color:var(--line);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tab b{font-weight:600;margin-right:4px}
main{max-width:1360px;margin:0 auto;padding:24px 24px 80px}
.muted{color:var(--mut)}.small{font-size:12px}.tiny{font-size:11px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.pad{padding:18px}
.grid{display:grid;gap:16px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11.5px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.chip.alex{background:var(--blueS);border-color:#cdd7ff;color:#2d46a8}
.chip.andy{background:var(--greenS);border-color:#c5e3d0;color:#24613d}
.chip.kim{background:var(--amberS);border-color:#efdcae;color:#7a530c}
.chip.charlie{background:var(--violetS);border-color:#d9cffc;color:#4d2fb0}
.eff{font-weight:600;padding:2px 8px;border-radius:6px;font-size:12px;white-space:nowrap}
.eff.Low{background:var(--greenS);color:var(--green)}.eff.Medium{background:var(--amberS);color:var(--amber)}.eff.High{background:var(--redS);color:var(--red)}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#000}
.btn.pri:disabled{background:#bdb8ae;border-color:#bdb8ae;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12.5px}
.link{background:none;border:none;padding:0;color:var(--blue);font-size:12.5px;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:#fff;flex:none}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:end;margin:8px 0 22px}
.hero h1{font-size:34px;line-height:1.15}
.hero p{max-width:720px}
.pcards{grid-template-columns:repeat(5,1fr)}
.pcard{padding:16px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:8px}
.pcard:hover{border-color:var(--ink);transform:translateY(-1px)}
.pcard .let{font-family:Raleway;font-size:26px;font-weight:600}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th,.t td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t th{font-weight:600;color:var(--mut);font-size:12px;background:var(--soft)}
.t tr:last-child td{border-bottom:none}
.sec{margin-top:26px}
.sec h2{font-size:22px;margin-bottom:10px}
.reco{border-left:3px solid var(--ink)}
.info{display:grid;grid-template-columns:1.3fr 1fr 1fr .9fr;margin-bottom:16px;overflow:hidden}
.info>div{padding:12px 14px;border-right:1px solid var(--line)}
.info>div:nth-child(4){border-right:none}
.info h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
.info ul{margin:0;padding-left:16px}
.info .insp{grid-column:1/-1;border-top:1px solid var(--line);background:var(--soft);font-size:12.5px;border-right:none}
.ptitle{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.ptitle h2{font-size:26px}
.frame{display:grid;grid-template-columns:210px 1fr;border:1px solid var(--line2);border-radius:14px;overflow:hidden;min-height:680px;background:var(--bg);box-shadow:0 8px 30px rgba(60,50,30,.06)}
.side{background:var(--side);padding:16px 10px;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.side .logo{padding:0 6px 14px;font-size:21px}
.side .lab{font-size:11.5px;color:var(--mut);padding:10px 8px 4px}
.si{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;color:#2b2a27;cursor:default}
.si svg{width:16px;height:16px;stroke:#555;fill:none;stroke-width:1.6;flex:none}
.si.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.si.new{cursor:pointer}
.si .nt{margin-left:auto;font-size:9.5px;background:var(--ink);color:#fff;border-radius:10px;padding:0 6px;text-transform:uppercase;letter-spacing:.04em}
.si .bd{margin-left:auto;font-size:10.5px;background:var(--blue);color:#fff;border-radius:10px;padding:0 6px}
.side .me{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px}
.cnt{padding:28px 34px;overflow:auto;position:relative}
.foot{font-size:11.5px;color:var(--mut);text-align:center;margin-top:24px}
.comp{background:#fff;border:1px solid var(--line);border-radius:12px;position:relative}
.comp textarea{width:100%;border:none;outline:none;resize:vertical;min-height:110px;padding:10px 16px 6px;background:transparent}
.comp .to{display:flex;align-items:center;gap:8px;padding:10px 14px 0;font-size:12.5px;color:var(--mut)}
.compbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--soft);border-top:1px solid var(--line);border-radius:0 0 12px 12px;flex-wrap:wrap}
.compbar .ic{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
.compbar svg{width:16px;height:16px;stroke:#666;fill:none;stroke-width:1.6}
.model{display:flex;align-items:center;gap:6px;padding:0 16px 10px;font-size:12.5px;color:#444}
.model svg{width:14px;height:14px}
.sel{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:4px 8px;font-size:12.5px}
.mention{position:absolute;left:16px;top:100px;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);width:360px;z-index:5;padding:6px}
.mention .mi{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer}
.mention .mi:hover{background:var(--soft)}
.ib{background:linear-gradient(180deg,#232320,#000);color:#fff;border:none;border-radius:8px;padding:6px 11px;display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:500}
.ib svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:1.7}
.ib.alt{background:#fff;color:#555;border:1px solid var(--line2)}
.ib.alt svg{stroke:#555}
.qc{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qi{font-size:11.5px;padding:2px 8px;border-radius:20px;border:1px solid}
.qi.ok{background:var(--greenS);color:var(--green);border-color:#c5e3d0}
.qi.no{background:var(--redS);color:var(--red);border-color:#f1cbc4}
.widget{margin-top:16px;background:#fff;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.wh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fcfbf8}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:4px 10px;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:#fff}
.wb{display:grid;grid-template-columns:.8fr 1.4fr}
.wb>div{padding:14px}
.orig{background:var(--soft);border-right:1px solid var(--line)}
.orig ul{padding-left:18px;margin:6px 0}
.sg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.sg.accepted{border-color:#b9dcc6;background:#f6fbf8}
.sg.rejected{opacity:.5;background:#faf9f6}
.sg.rejected .sgt{text-decoration:line-through}
.sgt{outline:none}
.sgt[contenteditable=true]{background:#fffbe8;border-radius:6px;padding:4px;box-shadow:inset 0 0 0 1px #efdcae}
.sga{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.sga .btn{padding:2px 8px;font-size:12px}
.st{font-size:11px;margin-left:auto;color:var(--mut)}
.why{margin-top:8px;font-size:12px;background:var(--blueS);border-radius:8px;padding:8px 10px;color:#22337a}
.tag{font-size:10.5px;padding:1px 7px;border-radius:10px;display:inline-block;margin-top:6px}
.tag.warn{background:var(--amberS);color:var(--amber)}
ins{background:#dff1e6;color:#1e5e39;text-decoration:none;border-radius:3px;padding:0 2px}
del{background:#fbe2de;color:#9b2c20;border-radius:3px;padding:0 2px}
.wf{padding:12px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fcfbf8}
.hitl{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.hitl svg{width:14px;height:14px;stroke:var(--mut);fill:none;stroke-width:1.8}
.done{background:var(--greenS);border:1px solid #c5e3d0;color:#1e5e39;border-radius:12px;padding:14px 16px;margin-top:16px}
.msgs{display:grid;grid-template-columns:250px 1fr;min-height:680px}
.tl{border-right:1px solid var(--line);background:#fbfaf6;padding:12px 8px}
.th{display:flex;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer;align-items:flex-start}
.th:hover{background:var(--soft)}
.th.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.thread{display:flex;flex-direction:column;min-height:680px;min-width:0}
.thh{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tb{flex:1;padding:18px;display:flex;flex-direction:column;gap:12px}
.bub{max-width:78%;padding:10px 13px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.bt{white-space:pre-wrap}
.bub.me{align-self:flex-end;background:#f1eee6}
.bub.fb{border-left:3px solid var(--ink)}
.meta{font-size:11px;color:var(--mut);margin-top:4px}
.tcomp{border-top:1px solid var(--line);padding:12px 18px;background:#fbfaf6}
.tcomp textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:84px;resize:vertical;background:#fff;outline:none}
.stars span{font-size:20px;color:#d4cec2;cursor:pointer;padding-right:2px}
.stars span.on{color:#c9971a}
.anon{font-size:11.5px;color:#4d4a44;background:var(--soft);border:1px dashed var(--line2);border-radius:8px;padding:6px 9px;display:flex;gap:6px;align-items:center}
.viewsw{display:inline-flex;border:1px solid var(--line2);border-radius:20px;overflow:hidden;background:#fff}
.viewsw button{border:none;background:none;padding:5px 12px;font-size:12.5px}
.viewsw button.on{background:var(--ink);color:#fff}
.kpis{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:14px;margin-bottom:18px}
.kpi{padding:14px 16px}
.kpi .n{font-family:Raleway;font-size:28px;font-weight:500}
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.person{padding:16px;cursor:pointer}
.person:hover{border-color:var(--ink)}
.prog{display:flex;gap:4px;margin-top:6px}
.prog i{flex:1;height:6px;border-radius:4px;background:#e7e2d7}
.prog i.on{background:var(--ink)}
.prog.click i{cursor:pointer;height:9px}
.hist{border-left:2px solid var(--line2);padding-left:14px;margin-left:6px}
.hi{position:relative;padding-bottom:14px}
.hi::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.lock{display:flex;gap:10px;align-items:center;background:var(--soft);border:1px dashed var(--line2);border-radius:10px;padding:10px 12px}
.word{border:1px solid #c8c8c8;border-radius:10px;overflow:hidden;background:#f3f2f1;box-shadow:0 8px 30px rgba(0,0,0,.08);font-family:"Segoe UI",Inter,system-ui,sans-serif}
.wtitle{background:#185abd;color:#fff;padding:7px 14px;font-size:12.5px;display:flex;justify-content:space-between}
.wrib{background:#fff;border-bottom:1px solid #ddd}
.wtabs{display:flex;gap:2px;padding:4px 10px 0;font-size:12.5px}
.wtabs span{padding:5px 10px;color:#333}
.wtabs span.on{border-bottom:3px solid #185abd;font-weight:600;color:#185abd}
.wtools{display:flex;gap:16px;padding:8px 14px;font-size:11.5px;color:#444;border-top:1px solid #eee;align-items:center}
.wtools .tg{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 8px;border-radius:4px}
.wtools .tg.on{background:#e1ebfa;outline:1px solid #b3c9ee}
.wtools .tg b{width:22px;height:22px;border-radius:4px;background:#ddd;display:block}
.wbody{display:grid;grid-template-columns:1fr 360px;min-height:640px}
.wdocwrap{padding:26px;display:grid;grid-template-columns:1fr 220px;gap:14px;align-items:start}
.page{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);padding:48px 56px;font-family:"Source Serif 4",Georgia,serif;font-size:13.5px;line-height:1.6;min-height:620px}
.page h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;text-align:center;font-size:16px;margin-bottom:16px}
.hl{background:#fff1a8}
.cm{background:#fff;border:1px solid #d0d0d0;border-left:3px solid #c43e1c;border-radius:4px;padding:8px 10px;font-size:11.5px;margin-bottom:10px}
.cm.new{border-left-color:#185abd;box-shadow:0 0 0 3px #e1ebfa}
.cm b{display:block;font-size:11.5px}
.pane{background:#fff;border-left:1px solid #d6d6d6;display:flex;flex-direction:column;font-family:Inter,sans-serif}
.paneh{padding:10px 14px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;gap:8px;font-weight:600}
.panec{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.pane .widget{margin-top:0}
.pane .widget .wb{grid-template-columns:1fr}
.pane .widget .orig{display:none}
.pane .wh .muted{display:none}
.sev{font-size:10.5px;padding:1px 6px;border-radius:4px;font-weight:600;flex:none}
.sev.H{background:var(--redS);color:var(--red)}.sev.M{background:var(--amberS);color:var(--amber)}.sev.L{background:var(--greenS);color:var(--green)}
.rev{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
.fsec{margin-bottom:14px}
.fsec label{font-weight:600;font-size:13px;display:block;margin-bottom:4px}
.fsec textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none;resize:vertical}
.nudge{font-size:12px;margin-top:5px;padding:6px 9px;border-radius:8px}
.nudge.warn{background:var(--amberS);color:#6e4c0d}
.nudge.ok{background:var(--greenS);color:#1e5e39}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:99;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.coachav{width:26px;height:26px;border-radius:50%;background:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none}
.coachav svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:1.8}
@media(max-width:1100px){.pcards{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.info{grid-template-columns:1fr 1fr}.wb{grid-template-columns:1fr}.rev{grid-template-columns:1fr}}
.home{max-width:1180px;margin:0 auto;padding:40px 0 20px}
.htitle{font-size:38px;text-align:center;margin-bottom:10px}
.hintro{text-align:center;color:var(--mut);font-size:15px;margin:0 auto 44px;max-width:720px}
.hcards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.hcard{padding:22px;display:flex;flex-direction:column;gap:10px;min-height:250px}
.hcard h3{font-size:17px;line-height:1.3}
.hcard p{margin:0;flex:1}
.hcard .btn{align-self:flex-start}
.hcard .let{font-family:Raleway;font-size:26px;font-weight:600}
.horder{text-align:center;margin:40px 0 36px;color:#3b3934}
.more{border-top:1px solid var(--line);padding-top:18px}
.more summary{cursor:pointer;font-family:Raleway;font-size:18px;font-weight:500;list-style:none;text-align:center;color:var(--mut)}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:" ▾"}
.more[open] summary::after{content:" ▴"}
.morein{margin-top:8px}
@media(max-width:1100px){.hcards{grid-template-columns:repeat(2,1fr)}}
.rate{margin-top:8px}
.rate summary{cursor:pointer;font-size:12px;color:var(--mut);list-style:none;display:inline-block}
.rate summary::-webkit-details-marker{display:none}
.rate summary:hover{color:var(--ink)}
.rate[open] summary{color:var(--ink)}
.ratein{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.ratein input{flex:1;min-width:150px;border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:12.5px}
.stars.sm span{font-size:16px;padding-right:0}
.ww{border:1px solid #c8c6c4;border-radius:8px;overflow:hidden;background:#f3f2f1;box-shadow:0 8px 30px rgba(0,0,0,.10);font-family:"Segoe UI","Segoe UI Web",Aptos,Calibri,Carlito,Inter,sans-serif;color:#323130;font-size:13px}
.ww-title{background:#185abd;color:#fff;height:40px;display:flex;align-items:center;gap:14px;padding:0 12px;font-size:13px}
.ww-logo{width:22px;height:22px;border-radius:3px;background:#fff;color:#185abd;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-family:"Segoe UI",Arial,sans-serif}
.ww-auto{display:flex;align-items:center;gap:6px;opacity:.9;font-size:12px}
.ww-auto i{width:28px;height:14px;border-radius:8px;background:#fff;position:relative;display:inline-block}
.ww-auto i::after{content:"";position:absolute;right:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#185abd}
.ww-doc{font-weight:600}.ww-saved{font-weight:400;opacity:.85}
.ww-search{margin:0 auto;background:rgba(255,255,255,.92);color:#605e5c;border-radius:4px;height:28px;width:340px;display:flex;align-items:center;gap:8px;padding:0 10px}
.ww-app{opacity:.9}
.ww-user{width:28px;height:28px;border-radius:50%;background:#e1dfdd;color:#323130;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.ww-tabs{display:flex;align-items:flex-end;gap:2px;background:#f3f2f1;padding:4px 10px 0;font-size:13px}
.ww-tabs>span{padding:6px 10px 7px;color:#323130;cursor:default}
.ww-tabs>span.on{color:#185abd;font-weight:600;box-shadow:inset 0 -3px 0 #185abd}
.ww-tabs>span.file{color:#185abd}

  render();mvpReveal();mvpAutosize();
 },700)}
function mvpReveal(){const el=$('#mvp-improved');if(el)el.scrollIntoView({block:'nearest'});mvpAutosize()}
function mvpAccept(){const g=mvpG(),c=g.improve;if(!c||c.status!=='ready')return;const text=mvpPlain(c);if(text)g.text=text;g.improve=null;render()}
function mvpDiscard(){mvpG().improve=null;render()}
function mvpEdit(){const el=$('#mvp-well')||$('#mvp-improve')||$('#mvp-next');if(el){el.focus();const n=el.value.length;el.setSelectionRange(n,n)}}
function mvpSend(){const g=mvpG(),c=g.improve,text=c&&c.status==='ready'?mvpPlain(c):g.text.trim();
 if(!text){toast('Write your feedback first');return}
 const me=mvpMe();
 if(g.to===me.id){toast('Choose someone else');return}
 const p=mvpAnyPerson(g.to),key=mvpGuideKey(g.topic),sub=(g.topic.trim()||'Feedback');
 mvpDeliver({id:'fb'+Date.now(),fromId:me.id,toId:g.to,subject:sub,type:MVP_TYPE[key],date:'23 Oct 2026',unread:true,body:text});
 let req=S.mvp.requests.find(r=>r.id===g.requestId);
 if(!req||req.status!=='waiting'||req.to!==me.id)req=S.mvp.requests.find(r=>r.status==='waiting'&&r.to===me.id&&r.from===g.to&&r.topic===g.topic.trim());
 if(req)req.status='answered';
 const owed=mvpOwed(),ix=owed.findIndex(o=>o.pid===g.to);if(ix>=0)owed.splice(ix,1);
 g.requestId=null;g.text='';g.topic='';g.improve=null;g.guideOpen=false;toast('Sent to '+p.first);render()}
function mvpOpen(id){const it=S.mvp.feedback.find(x=>x.id===id);if(!it)return;
 if(it.toId!==mvpMeId()&&it.fromId!==mvpMeId())return;
 if(it.toId===mvpMeId())it.unread=false;
 S.mvp.detailId=id;S.mvp.main='receive';render()}
function mvpBack(){S.mvp.detailId=null;S.mvp.main='receive';render()}
function mvpOverview(){const waiting=mvpWaitingForMe(),owed=mvpOwed(),recv=mvpRecv(),latest=recv[0];
 const seen=new Set(waiting.map(r=>r.from));
 const reqNames=waiting.map(r=>{const p=mvpAnyPerson(r.from);return `<div class="small row" style="cursor:pointer" onclick="event.stopPropagation();mvpRespond('${r.id}')"><span class="av" style="background:${p.col};width:22px;height:22px;font-size:9px">${esc(p.ini)}</span> <span>${esc(p.first)}</span><span class="chip mvp-reqtag">Requested</span></div>`}).join('');
 const owedNames=owed.filter(o=>!seen.has(o.pid)).map(o=>{const p=mvpOwedPerson(o);return `<div class="small row"><span class="av" style="background:${p.col};width:22px;height:22px;font-size:9px">${esc(p.ini)}</span> <span>${esc(p.first)}</span></div>`}).join('');
 const names=reqNames+owedNames||'<div class="small muted">Nothing waiting</div>';
 const n=waiting.length+owed.filter(o=>!seen.has(o.pid)).length;
 const who=latest?mvpAnyPerson(latest.fromId):null;
 return `<div class="mvp-sum"><div class="card kpi" id="mvp-owed" onclick="mvpGo('give')"><div class="small muted">Give Feedback</div><div class="n">${n}</div>${names}</div>
 <div class="card kpi" id="mvp-inbox" onclick="S.mvp.inbox='received';mvpGo('receive')"><div class="small muted">Received Feedback</div><div class="n">${recv.length}</div>${latest?`<div class="small">${esc(who.name)}</div><div class="tiny muted">${esc(latest.subject)} · ${latest.date}</div>`:'<div class="small muted">None yet</div>'}</div></div>`}
function mvpGuidePanel(){const g=mvpG(),key=mvpGuideKey(g.topic),qs=MVP_GUIDE[key],n=qs.length;
 if(g.guideDone)return `<div class="card pad mvp-qcard" id="mvp-guide-panel"><div class="row between"><b>Help me get started</b><button class="icb" title="Close" onclick="mvpGuideClose()">✕</button></div><p class="mvp-qtext muted">That was the last question.</p><div class="row wrap"><button class="btn pri sm" onclick="mvpGuideRestart()">Start over</button><button class="btn sm" onclick="mvpGuideClose()">Close</button></div></div>`;
 const i=Math.min(g.guideIdx,n-1);
 return `<div class="card pad mvp-qcard" id="mvp-guide-panel"><div class="row between"><b>Help me get started</b><button class="icb" title="Close" onclick="mvpGuideClose()">✕</button></div>
 <div class="tiny muted" style="margin-top:6px">Question ${i+1} of ${n} · ${MVP_GUIDE_LABEL[key]}</div>
 <p class="mvp-qtext" id="mvp-qtext">${esc(mvpQ(qs[i]))}</p>
 <div class="row wrap"><button class="btn pri sm" id="mvp-use-q" onclick="mvpUseQ()">Use this question</button><button class="btn sm" id="mvp-skip-q" onclick="mvpGuideNext()">${i===n-1?'Finish':'Skip / Next'}</button>${i>0||g.guideDone?`<button class="link tiny" onclick="mvpGuideBack()">← Back</button>`:''}</div></div>`}
function mvpCard(){const c=mvpG().improve;if(!c)return '';
 if(c.status==='loading')return `<div class="widget" id="mvp-improved"><div class="wh"><span class="coachav">${ic('spark')}</span><b>Improve feedback</b></div><div class="pad small muted"><span class="spin"></span> Reading your notes…</div></div>`;
 const labels={well:'What went well',improve:'What to improve',next:'Next steps'};
 const sec=k=>c[k].trim()?`<div class="fsec mvp-sec"><label>${labels[k]}</label><textarea id="mvp-${k}" rows="3" oninput="mvpSet('${k}',this.value)">${esc(c[k])}</textarea></div>`:'';
 const acts=`<span style="margin-left:auto" class="row"><button class="btn sm pri" id="mvp-accept" onclick="mvpAccept()">Accept</button><button class="btn sm" id="mvp-edit" onclick="mvpEdit()">Edit</button><button class="btn sm" id="mvp-discard" onclick="mvpDiscard()">Discard</button></span>`;
 return `<div class="widget" id="mvp-improved"><div class="wh"><span class="coachav">${ic('spark')}</span><b>Improved feedback</b>${acts}</div><div class="pad"><p class="small muted mvp-expandnote" id="mvp-expand-note">Saga expanded your notes. Check and edit before sending.</p>${sec('well')}${sec('improve')}${sec('next')}</div></div>`}
function mvpReqBanner(){const waiting=mvpWaitingForMe();if(!waiting.length)return '';
 return waiting.map(r=>{const p=mvpAnyPerson(r.from);return `<div class="mvp-reqrow" id="mvp-req-${r.id}"><span class="av" style="background:${p.col};width:28px;height:28px;font-size:10px">${esc(p.ini)}</span><div class="mvp-reqmeta"><b>${esc(p.name)}</b> requested feedback · ${esc(r.topic)}</div><button class="btn sm pri" onclick="mvpRespond('${r.id}')">Respond</button></div>`}).join('')}
function mvpGive(){const g=mvpG(),people=mvpPeople(),sel=mvpAnyPerson(g.to);
 return `${mvpReqBanner()}<div class="mvp-lay${g.guideOpen?'':' one'}"><div>
 <div class="tiny muted">To</div>
 <div class="mvp-to"><span class="av" style="background:${sel.col};width:32px;height:32px">${esc(sel.ini)}</span>
 <select class="mvp-field" id="mvp-to" aria-label="Recipient" onchange="mvpPickTo(this.value)">${people.map(p=>`<option value="${p.id}" ${g.to===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
 <div class="tiny muted" style="margin-top:14px">Topic</div>
 <input class="mvp-field" id="mvp-topic" placeholder="What is the feedback about? e.g. Q3 performance review, the Hansen employment case" value="${esc(g.topic)}" oninput="mvpTopicIn(this.value)">
 <textarea id="mvp-text" class="mvp-ta" placeholder="Write in your own words. Bullets are fine." oninput="mvpG().text=this.value">${esc(g.text)}</textarea>
 <div class="row wrap" style="margin-top:8px"><button class="icb" id="mvp-mic" title="Dictate" onclick="mvpDictate()">${icn('mic',16)}</button>
 <button class="mvp-help ${g.guideOpen?'on':''}" id="mvp-guide" title="Saga asks you guiding questions" onclick="mvpGuide()">${icn('bulb',15)} Help me get started</button>
 <span style="margin-left:auto" class="row"><button class="btn" id="mvp-improve-btn" onclick="mvpImprove()">Improve feedback</button><button class="btn pri" id="mvp-send" onclick="mvpSend()">Send feedback</button></span></div>
 ${mvpCard()}</div>${g.guideOpen?mvpGuidePanel():''}</div>`}
function mvpRequest(){const d=mvpRQ(),people=mvpReqPeople(),sel=mvpAnyPerson(d.to),mine=mvpMyRequests();
 const rows=mine.map(r=>{const p=mvpAnyPerson(r.to);return `<div class="mvp-item"><span class="av" style="background:${p.col};width:32px;height:32px">${esc(p.ini)}</span><div><b>${esc(p.name)}</b><div class="small muted">${esc(r.topic)}</div></div><span class="mvp-status ${r.status}">${r.status==='answered'?'Answered':'Waiting'}</span><span class="tiny muted">${r.date}</span></div>`}).join('');
 return `<div style="max-width:720px">
 <div class="tiny muted">To</div>
 <div class="mvp-to"><span class="av" style="background:${sel.col};width:32px;height:32px">${esc(sel.ini)}</span>
 <select class="mvp-field" id="mvp-req-to" aria-label="Request from" onchange="mvpRQ().to=this.value;render()">${people.map(p=>`<option value="${p.id}" ${d.to===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
 <div class="tiny muted" style="margin-top:14px">Topic</div>
 <input class="mvp-field" id="mvp-req-topic" placeholder="What do you want feedback on?" value="${esc(d.topic)}" oninput="mvpRQ().topic=this.value">
 <div class="tiny muted" style="margin-top:14px">Message <span class="muted">(optional)</span></div>
 <textarea class="mvp-field mvp-msg" id="mvp-req-msg" placeholder="A short note for the person you ask" oninput="mvpRQ().message=this.value">${esc(d.message)}</textarea>
 <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn pri" id="mvp-req-send" onclick="mvpSendRequest()">Send request</button></div>
 <h3 style="font-size:16px;margin:22px 0 10px">Your requests</h3>
 <div class="card mvp-reqlist">${rows||'<div class="pad small muted">No requests yet</div>'}</div></div>`}
function mvpSeg(){const k=S.mvp.inbox;
 return `<div class="seg mvp-inboxseg">${[['received','Received'],['sent','Sent']].map(([id,label])=>`<button type="button" class="${k===id?'on':''}" id="mvp-inbox-${id}" onclick="mvpInbox('${id}')">${label}</button>`).join('')}</div>`;
}
function mvpList(){const sent=S.mvp.inbox==='sent',items=sent?mvpSent():mvpRecv();
 const rows=items.map(it=>{const p=mvpAnyPerson(sent?it.toId:it.fromId);const dot=!sent&&it.unread?'<i class="mvp-dot" title="Unread"></i>':'';
  return `<div class="mvp-item" data-mvp-item="${it.id}" onclick="mvpOpen('${it.id}')"><span class="av" style="background:${p.col};width:32px;height:32px">${esc(p.ini)}</span><div><div class="row"><b>${esc(p.name)}</b>${dot}</div><div class="small muted">${esc(it.subject)}</div></div><span class="chip">${esc(it.type)}</span><span class="tiny muted">${it.date}</span></div>`}).join('');
 return `${mvpSeg()}<div class="card">${rows||`<div class="pad small muted">${sent?'No sent feedback yet':'No feedback yet'}</div>`}</div>`}
function mvpDetail(){const it=S.mvp.feedback.find(x=>x.id===S.mvp.detailId);if(!it)return mvpMain();
 const sent=S.mvp.inbox==='sent',p=mvpAnyPerson(sent?it.toId:it.fromId),who=sent?'To '+p.name:p.name;
 return `<button class="back" id="mvp-back" onclick="mvpBack()">← Back</button><div class="card pad" id="mvp-detail" style="margin-top:8px"><div class="row"><span class="av" style="background:${p.col};width:36px;height:36px">${esc(p.ini)}</span><div><b>${esc(who)}</b><div class="tiny muted">${esc(it.subject)}</div></div><span class="chip" style="margin-left:auto">${esc(it.type)}</span></div><div class="tiny muted" style="margin:10px 0">${it.date}</div><div class="mvp-body">${esc(it.body)}</div></div>`}
function mvpMain(){const m=S.mvp,tabs=[['give','Give Feedback'],['request','Request Feedback'],['receive','Received Feedback']];
 const body=m.main==='give'?mvpGive():m.main==='request'?mvpRequest():mvpList();
 return mvpOverview()+`<div class="ptabs">${tabs.map(([k,l])=>`<span class="${m.main===k?'on':''}" data-mvp-main="${k}" onclick="mvpGo('${k}')">${l}</span>`).join('')}</div>${body}`}
function rMVP(){const me=mvpMe();
 return `<div class="frame">${sidebar('fs',[{k:'fs',i:'users',l:'Feedback Space',on:'mvpHome()'}],me,true)}<div class="cnt" style="padding:24px 28px">
 <div class="row between wrap"><h1 class="projt">Feedback Space</h1><span class="row"><span class="chip">MVP</span><span class="small muted">${esc(me.name)} · ${esc(me.roleLabel)}</span></span></div>
 ${S.mvp.detailId?mvpDetail():mvpMain()}</div></div>`}
/* ---------- E ---------- */
function nHTML(k,n,t){return (n[0]==='ok'?'✓ ':'💡 ')+esc(n[1])+(n[0]==='warn'&&t==='alex'&&k==='imp'?` <button class="link" id="e-ex" onclick="eEx()">Add an example placeholder</button>`:'')}
S.e.s=S.e.r.anna.s;
window.addEventListener('error',e=>console.error('page error',e.message));
S.a=aFresh();
render();
</script>
</body></html>
